name: Validate Geometry Dash skills

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed codec and release-gate tests
        run: python3 -m unittest discover -s shared/tests -p 'test_*.py' -v
